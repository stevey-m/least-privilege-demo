name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Blocks the PR if a newly introduced dependency has a
          # known vulnerability at or above this severity.
          fail-on-severity: moderate
          comment-summary-in-pr: always
